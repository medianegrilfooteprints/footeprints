<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Day Pass · Negril FootePrints Hotel</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0D404A;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}a{color:#7DD3BC}</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="88f031e5-b5f9-4343-af8d-d07e18924fac"></script>
</head><body><p>Opening the Day Pass booking…<br><a id="go" href="https://www.tickettailor.com/events/negrilfooteprintshotel/2452834">Tap here if it doesn’t open</a></p>
<script>
(function(){
  var q = new URLSearchParams(location.search), keep = new URLSearchParams();
  ['utm_source','utm_medium','utm_campaign','utm_content'].forEach(function(k){ if (q.get(k)) keep.set(k, q.get(k)); });
  var url = 'https://www.tickettailor.com/events/negrilfooteprintshotel/2452834' + (keep.toString() ? '?' + keep.toString() : '');
  document.getElementById('go').href = url;
  var done = false; function go(){ if (done) return; done = true; location.replace(url); }
  function send(){
    try { window.umami.track('lite-go-daypass', { source: (q.get('utm_source') || 'direct') + ' / ' + (q.get('utm_medium') || '-') }).then(go, go); } catch (e) { go(); }
    setTimeout(go, 700);
  }
  var n = 0, t = setInterval(function(){ if (window.umami && window.umami.track) { clearInterval(t); send(); } else if (++n > 15) { clearInterval(t); go(); } }, 100);
})();
</script></body></html>
